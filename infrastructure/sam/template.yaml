AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Runbook Guardian - API cloud (Lambda + API Gateway) y frontend estático (S3 + CloudFront).
  Lambda usa Bedrock directamente (sin sentence-transformers) para mantenerse dentro del límite de 250MB.

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: python3.11

Parameters:
  ProjectName:
    Type: String
    Default: runbook-guardian

  Environment:
    Type: String
    Default: dev

  BedrockModelId:
    Type: String
    Default: us.anthropic.claude-haiku-4-5-20251001-v1:0

  S3RunbooksBucket:
    Type: String
    Default: ""
    Description: Bucket con runbooks (vacío = usar los empaquetados en Lambda)

Resources:
  # ==========================================================================
  # BACKEND: Lambda + API Gateway
  # ==========================================================================

  QueryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-query-${Environment}"
      Handler: backend/lambda_handler.handler
      CodeUri: ../../
      Description: API backend de Runbook Guardian (Bedrock direct)
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          BEDROCK_MAX_TOKENS: "500"
          BEDROCK_TEMPERATURE: "0.1"
          S3_RUNBOOKS_BUCKET: !Ref S3RunbooksBucket
          RUNBOOKS_PATH: ./data/runbooks
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: "*"
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:ListBucket
              Resource:
                - !Sub "arn:aws:s3:::${ProjectName}-source-*"
                - !Sub "arn:aws:s3:::${ProjectName}-source-*/*"
      Events:
        QueryPost:
          Type: Api
          Properties:
            Path: /api/v1/query
            Method: post
            RestApiId: !Ref ApiGateway
        HealthGet:
          Type: Api
          Properties:
            Path: /api/v1/health
            Method: get
            RestApiId: !Ref ApiGateway
        RunbooksGet:
          Type: Api
          Properties:
            Path: /api/v1/runbooks
            Method: get
            RestApiId: !Ref ApiGateway
        CorsOptions:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: options
            RestApiId: !Ref ApiGateway
      Tags:
        Project: !Ref ProjectName
        Environment: !Ref Environment

  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${ProjectName}-api-${Environment}"
      StageName: !Ref Environment
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"

  # ==========================================================================
  # FRONTEND: S3 + CloudFront
  # ==========================================================================

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-frontend-${AWS::AccountId}-${Environment}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${ProjectName}-oac-${Environment}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Comment: !Sub "Runbook Guardian Frontend - ${Environment}"
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOAC
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          ForwardedValues:
            QueryString: false
        PriceClass: PriceClass_100

Outputs:
  ApiUrl:
    Description: URL de la API
    Value: !Sub "https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"

  FrontendUrl:
    Description: URL del frontend
    Value: !Sub "https://${CloudFrontDistribution.DomainName}"

  FrontendBucketName:
    Description: Bucket del frontend
    Value: !Ref FrontendBucket
