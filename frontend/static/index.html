<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Runbook Guardian</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f1419; color: #e7e9ea; min-height: 100vh; }
        .container { max-width: 900px; margin: 0 auto; padding: 2rem; }
        header { text-align: center; margin-bottom: 2rem; padding: 1.5rem; background: #1a1f2e; border-radius: 12px; border: 1px solid #2d3748; }
        header h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
        header p { color: #9ca3af; font-size: 0.9rem; }
        .search-box { display: flex; gap: 0.75rem; margin-bottom: 1.5rem; }
        .search-box input { flex: 1; padding: 0.875rem 1rem; border-radius: 8px; border: 1px solid #374151; background: #1f2937; color: #e7e9ea; font-size: 1rem; }
        .search-box input:focus { outline: none; border-color: #3b82f6; }
        .search-box button { padding: 0.875rem 1.5rem; background: #3b82f6; color: white; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; font-weight: 600; }
        .search-box button:hover { background: #2563eb; }
        .search-box button:disabled { background: #4b5563; cursor: not-allowed; }
        .status-bar { display: flex; justify-content: space-between; padding: 0.75rem 1rem; background: #1a1f2e; border-radius: 8px; margin-bottom: 1rem; font-size: 0.8rem; color: #9ca3af; border: 1px solid #2d3748; }
        .status-bar .badge { padding: 0.25rem 0.5rem; border-radius: 4px; font-weight: 600; }
        .badge-ok { background: #065f46; color: #6ee7b7; }
        .badge-fallback { background: #78350f; color: #fcd34d; }
        .badge-error { background: #7f1d1d; color: #fca5a5; }
        .results { display: flex; flex-direction: column; gap: 1rem; }
        .result-card { background: #1a1f2e; border: 1px solid #2d3748; border-radius: 10px; padding: 1.25rem; }
        .result-card.warning { border-color: #dc2626; }
        .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
        .result-header .section { font-weight: 600; color: #60a5fa; }
        .result-header .score { background: #1e3a5f; padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.8rem; }
        .result-content { background: #111827; padding: 1rem; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; white-space: pre-wrap; line-height: 1.6; margin-bottom: 0.75rem; max-height: 300px; overflow-y: auto; }
        .result-meta { display: flex; gap: 1rem; font-size: 0.75rem; color: #6b7280; flex-wrap: wrap; }
        .warning-badge { background: #7f1d1d; color: #fca5a5; padding: 0.4rem 0.8rem; border-radius: 6px; font-size: 0.8rem; margin-bottom: 0.75rem; display: inline-block; }
        .rejected-panel { background: #1a1f2e; border: 1px solid #374151; border-radius: 8px; padding: 1rem; margin-top: 1rem; }
        .rejected-panel summary { cursor: pointer; color: #9ca3af; font-size: 0.85rem; }
        .rejected-item { padding: 0.3rem 0; font-size: 0.8rem; color: #ef4444; }
        .empty-state { text-align: center; padding: 3rem; color: #6b7280; }
        .loading { text-align: center; padding: 2rem; color: #60a5fa; }
        .footer-meta { display: flex; gap: 1.5rem; padding: 1rem 0; font-size: 0.75rem; color: #6b7280; border-top: 1px solid #2d3748; margin-top: 1rem; }
        #error-msg { background: #7f1d1d; color: #fca5a5; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>&#128737; Runbook Guardian</h1>
            <p>Asistente seguro para equipos on-call — evidencia de runbooks versionados</p>
        </header>

        <div class="search-box">
            <input type="text" id="query-input" placeholder="Describe el incidente o s&iacute;ntoma..." maxlength="500">
            <button id="search-btn" onclick="submitQuery()">Consultar</button>
        </div>

        <div id="error-msg"></div>
        <div id="status-bar" class="status-bar" style="display:none;"></div>
        <div id="results" class="results"></div>
        <div id="footer-meta" class="footer-meta" style="display:none;"></div>
    </div>

    <script>
        // Configuración: cambiar esta URL después del deploy
        const API_URL = window.location.hostname === 'localhost'
            ? 'http://localhost:8000'
            : '';  // Se autoconfigura con la API Gateway URL

        const input = document.getElementById('query-input');
        const btn = document.getElementById('search-btn');

        input.addEventListener('keypress', (e) => { if (e.key === 'Enter') submitQuery(); });

        async function submitQuery() {
            const query = input.value.trim();
            if (!query) return;

            btn.disabled = true;
            btn.textContent = 'Buscando...';
            document.getElementById('error-msg').style.display = 'none';
            document.getElementById('results').innerHTML = '<div class="loading">Buscando en runbooks...</div>';
            document.getElementById('status-bar').style.display = 'none';
            document.getElementById('footer-meta').style.display = 'none';

            try {
                const apiBase = API_URL || window.API_BASE_URL || '';
                const response = await fetch(`${apiBase}/api/v1/query`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query }),
                });

                if (!response.ok) {
                    throw new Error(`Error ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                renderResults(data);
            } catch (error) {
                document.getElementById('results').innerHTML = '';
                const errDiv = document.getElementById('error-msg');
                errDiv.textContent = `Error de conexi\u00f3n: ${error.message}. Verifica que la API est\u00e9 disponible.`;
                errDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Consultar';
            }
        }

        function renderResults(data) {
            const { results, warnings, rejected_sources, metadata } = data;

            // Status bar
            const statusBar = document.getElementById('status-bar');
            const mode = metadata.mode;
            const badgeClass = mode === 'normal' ? 'badge-ok' : mode === 'fallback' ? 'badge-fallback' : 'badge-error';
            const provider = metadata.provider_used || 'local';
            statusBar.innerHTML = `
                <span>Proveedor: <strong>${provider}</strong></span>
                <span class="badge ${badgeClass}">${mode}</span>
                ${metadata.fallback_applied ? `<span>Fallback: ${metadata.fallback_reason}</span>` : ''}
                ${metadata.human_approval_required ? '<span class="badge badge-error">APROBACI&Oacute;N REQUERIDA</span>' : ''}
            `;
            statusBar.style.display = 'flex';

            // Results
            const resultsDiv = document.getElementById('results');

            if (results.length === 0) {
                resultsDiv.innerHTML = '<div class="empty-state">No se encontr&oacute; documentaci&oacute;n relevante. Intente reformular.</div>';
            } else {
                resultsDiv.innerHTML = results.map((r, i) => `
                    <div class="result-card ${r.warnings.length > 0 ? 'warning' : ''}">
                        <div class="result-header">
                            <span class="section">${r.section}</span>
                            <span class="score">${r.similarity_score > 0 ? r.similarity_score.toFixed(2) : 'N/A'}</span>
                        </div>
                        ${r.warnings.map(w => `<div class="warning-badge">&#9888;&#65039; ${w}</div>`).join('')}
                        <div class="result-content">${escapeHtml(r.text)}</div>
                        <div class="result-meta">
                            <span>&#128193; ${r.source_file}</span>
                            <span>&#127991; v${r.version}</span>
                            <span>&#128197; ${r.last_reviewed}</span>
                        </div>
                    </div>
                `).join('');
            }

            // Rejected sources
            if (rejected_sources.length > 0) {
                resultsDiv.innerHTML += `
                    <details class="rejected-panel">
                        <summary>&#128683; Fuentes rechazadas (${rejected_sources.length})</summary>
                        ${rejected_sources.map(r => `<div class="rejected-item">${r.source_file}: ${r.reason}</div>`).join('')}
                    </details>
                `;
            }

            // Footer meta
            const footerDiv = document.getElementById('footer-meta');
            footerDiv.innerHTML = `
                <span>&#9200; ${metadata.response_time_ms}ms</span>
                <span>&#128218; ${metadata.total_candidates} candidatos</span>
                <span>&#128295; ${metadata.mode}</span>
            `;
            footerDiv.style.display = 'flex';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Auto-detect API URL from config.js (loaded separately in production)
        if (window.API_BASE_URL) {
            console.log('API configured:', window.API_BASE_URL);
        }
    </script>
</body>
</html>
